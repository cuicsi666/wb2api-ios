name: build-ios

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["V*"]

jobs:
  go-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go/go.sum
      - name: Go build & vet
        working-directory: go
        env:
          GOFLAGS: ""
        run: |
          set -euo pipefail
          go version
          go build ./...
          go vet ./internal/app/ ./wbios/ ./iosmain/ || true
          echo "go build OK"
